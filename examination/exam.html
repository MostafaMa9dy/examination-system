<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam - ProExam</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div id="popupOverlay" class="popup-overlay">
    <div class="popup-box">

        <div class="popup-icon" id="popupIcon">⚠</div>

        <p id="popupMessage">Message</p>

        <div class="popup-buttons">
            <button class="popup-btn yes" id="popupYes">Yes</button>
            <button class="popup-btn no" id="popupNo">No</button>
        </div>

    </div>
</div>

    <span class="material-icons doodle doodle-1">edit</span>
    <span class="material-icons doodle doodle-2">gesture</span>
    <span class="material-icons doodle doodle-3">auto_awesome</span>



    <div class="container">
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 0.5rem">
          <span class="material-icons">person_outline</span>
          <span class="nameuser"> </span>
        </div>

        <div style="display: flex; align-items: center; gap: 0.5rem">
          <span class="material-icons">help_outline</span>
          <span>Question <span id="currentNum">1</span>/10</span>
        </div>
        <div class="timer-box">
          <span class="material-icons" style="font-size: 1.2rem">schedule</span>
          <span id="timer">01:00</span>
        </div>
        <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb">
              <span class="material-icons" id="themeIcon">dark_mode</span>
            </span>
          </span>
        </button>
      </div>

      <div class="quiz-header">
        <h1 class="quiz-title">
          Quiz
          <span class="material-icons">lightbulb</span>
        </h1>
      </div>

      
      <div class="quiz-card">
        <span class="material-icons question-mark-icon">help</span>

        <h2 id="qText" class="question-text">
          Which is the most visited website in the world in 2024?
        </h2>

        <div id="optionsList" class="options-container">
         
        </div>

        <div class="nav-footer">
          <button id="prevBtn" class="btn-quiz btn-prev">Previous</button>
          <button
            id="markBtn"
            class="btn-quiz btn-prev"
            style="display: flex; align-items: center; justify-content: center"
          >
            <span class="material-icons" id="markIcon">flag</span>
          </button>
          <button id="nextBtn" class="btn-quiz btn-next">Next Question</button>
        </div>
      </div>

      <div class="nav-grid-quiz" id="navGrid">
        
      </div>

      <div style="text-align: center; margin-top: 2rem"></div>
    </div>

    <script src="questions.js"></script>
    <!-- <script src="exam.js"></script> -->
     <script src="exam2.js"></script>
  </body>
</html>
